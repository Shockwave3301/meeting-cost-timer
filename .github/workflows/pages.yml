name: Deploy to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-progress deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Only the default branch goes live; pushes to other branches are skipped.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - name: Collect site files
        run: |
          mkdir _site
          cp index.html styles.css app.js _site/
          # Cache-bust per deploy (styles.css → styles.css?v=<commit>) so nobody gets a stale mix of old and new files.
          sed -i -E "s/(styles\.css|app\.js)\"/\1?v=${GITHUB_SHA::7}\"/g" _site/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
